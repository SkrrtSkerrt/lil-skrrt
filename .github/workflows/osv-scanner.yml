name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on dependency changes and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions. Because the
# lockfiles are currently clean, fail-on-vuln is enabled so new vulnerable pins
# block before merge instead of landing silently.
#
# Complements supply-chain-audit.yml, which scans PR diffs for malicious code
# patterns. This workflow covers the orthogonal "currently-pinned dependency
# became known-vulnerable" case.
#
# Uses Google's officially-recommended reusable workflow, pinned by SHA.
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).

on:
  pull_request:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'ui-tui/package.json'
      - 'ui-tui/package-lock.json'
      - 'ui-tui/packages/hermes-ink/package.json'
      - 'ui-tui/packages/hermes-ink/package-lock.json'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'scripts/whatsapp-bridge/package.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
      - 'osv-scanner.toml'
      - '.github/workflows/osv-scanner.yml'
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'ui-tui/package.json'
      - 'ui-tui/package-lock.json'
      - 'ui-tui/packages/hermes-ink/package.json'
      - 'ui-tui/packages/hermes-ink/package-lock.json'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'scripts/whatsapp-bridge/package.json'
      - 'scripts/whatsapp-bridge/package-lock.json'
      - 'osv-scanner.toml'
      - '.github/workflows/osv-scanner.yml'
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # Required by the reusable workflow to upload SARIF to the Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1  # v2.5.0
    with:
      # Scan explicit lockfiles rather than recursing, so we only look at
      # sources of truth and skip vendored / test / worktree dirs.
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=package-lock.json
        --lockfile=web/package-lock.json
        --lockfile=ui-tui/package-lock.json
        --lockfile=ui-tui/packages/hermes-ink/package-lock.json
        --lockfile=website/package-lock.json
        --lockfile=scripts/whatsapp-bridge/package-lock.json
      fail-on-vuln: true
